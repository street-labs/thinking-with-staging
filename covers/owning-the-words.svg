<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Cover for "Owning the Words" - template matched to pleasure-persuasion.png:
       dark field, visual left, header / title / avatar+name right -->
  <defs>
    <radialGradient id="wax" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#a8322a"/>
      <stop offset="0.7" stop-color="#8c2620"/>
      <stop offset="1" stop-color="#6e1c17"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#181818"/>

  <!-- left visual: sheet with ghost lines, bound by the wax seal -->
  <g transform="translate(120 60)">
    <g fill="#fbf7ec" stroke="#4a4238" stroke-width="3">
      <rect x="60" y="60" width="440" height="560" rx="6" transform="rotate(-5 280 340)"/>
      <rect x="110" y="40" width="440" height="560" rx="6" transform="rotate(2 330 320)"/>
    </g>
    <g stroke="#b7ab8d" stroke-width="6" stroke-linecap="round" opacity="0.55" transform="rotate(-1 330 320)">
      <path d="M180 150 h280"/><path d="M180 200 h240"/><path d="M180 250 h300"/>
      <path d="M180 300 h210"/><path d="M180 350 h270"/><path d="M180 400 h190"/>
      <path d="M180 450 h250"/><path d="M180 500 h220"/>
    </g>
    <!-- drifting letters -->
    <g fill="#9a8c68" font-family="Georgia, serif" font-size="56" opacity="0.7">
      <text x="560" y="140" transform="rotate(-12 560 140)">w</text>
      <text x="650" y="260" transform="rotate(9 650 260)">o</text>
      <text x="580" y="420" transform="rotate(-8 580 420)">r</text>
      <text x="660" y="560" transform="rotate(13 660 560)">d</text>
      <text x="540" y="660" transform="rotate(-10 540 660)">s</text>
      <text x="700" y="700" transform="rotate(7 700 700)">.</text>
    </g>
    <g transform="translate(330 600)">
      <circle r="92" fill="url(#wax)"/>
      <circle r="92" fill="none" stroke="#5f1713" stroke-width="5" opacity="0.6"/>
      <circle r="64" fill="none" stroke="#f0c9b8" stroke-width="4" opacity="0.65"/>
      <path d="M-44 16 C -25 -28, -7 -28, 5 5 S 33 36, 46 -5"
            fill="none" stroke="#f0c9b8" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- right column: header, title, author -->
  <g text-anchor="middle">
    <text x="1130" y="270" font-family="Georgia, serif" font-size="34" fill="#e8e2d4">digital sovereignty</text>
    <text x="1130" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-style="italic" fill="#c2497c">Owning</text>
    <text x="1130" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-style="italic" fill="#c2497c">the Words</text>
    <circle cx="985" cy="690" r="52" fill="url(#wax)" stroke="#f0c9b8" stroke-width="3"/>
    <text x="1105" y="705" font-family="Georgia, serif" font-size="40" fill="#e8e2d4" text-anchor="start">Luke</text>
  </g>
</svg>
