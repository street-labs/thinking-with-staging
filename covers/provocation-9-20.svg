<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Provocation card: 9/20/2026, fits the whole text in the 1600x900 slide -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf6ee"/>
      <stop offset="1" stop-color="#efe7d6"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <g font-family="'Caveat', 'Segoe Script', 'Bradley Hand', 'Comic Sans MS', cursive" fill="#22262b">
    <text x="800" y="120" font-size="48" text-anchor="middle" fill="#22262b" opacity="0.75">A daily provocation&#8230;</text>
    <text x="800" y="210" font-size="56" text-anchor="middle" fill="#8c2620" font-weight="700">9/20/2026</text>
    <g font-size="52" text-anchor="middle">
      <text x="800" y="300">Taking something for granted can also be a wonderful expression</text>
      <text x="800" y="380">of generosity - to feel so comfortable and confident in another</text>
      <text x="800" y="460">person&#8217;s behavior toward you that you take them for granted</text>
      <text x="800" y="540">can be a deep compliment</text>
    </g>
  </g>
  <path d="M640 640 q160 60 320 0" fill="none" stroke="#8c2620" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
</svg>
